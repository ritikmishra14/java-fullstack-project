<div class="container emp-table">
  <table class="table table-hover emp-table">
    <thead>
     <tr>
      <th>Employee Id</th>
       <th>First Name</th>
       <th>Last Name</th>
       <th>Email Id</th>
       <th>Actions</th>
     </tr>
     
    </thead>
    <tbody>
     <tr *ngFor="let employee of employees">
      <td> {{ employee.employeeId}} </td>
     <td> {{ employee.firstName }} </td>
     <td> {{ employee.lastName }} </td>
     <td> {{ employee.email }} </td>
     <td>
      <button (click)="updateEmployee(employee.employeeId ?? ' ')" class="btn btn-info">
        Update
      </button>
      
      <button (click)="deleteEmployee(employee.employeeId ?? ' ')" class="btn btn-danger">
        Delete
      </button>
     </td>
     </tr>
    </tbody>
   </table>
</div>
